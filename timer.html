*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;font:16px/1.4 Jua,"Malgun Gothic",sans-serif;color:var(--ink);user-select:none;cursor:default}
#root{position:relative;width:450px;height:244px;background:rgba(255,255,255,.02)}
body.fs{background:#fff6e6}
body.fs #root{width:100vw;height:100vh;background:transparent}
body.adjust #root{outline:3px dashed var(--c);outline-offset:-3px;-webkit-app-region:drag;background:rgba(255,246,230,.55)}
#stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.ring,.water{display:none}
body.fs.v-ring .ring{display:block}body.fs.v-water .water{display:block}
.ring{position:absolute;height:80vh;max-width:96vw;aspect-ratio:1;transform:translateY(-5vh)}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:var(--soft)}
.ring .fg{stroke:var(--c);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .25s linear,stroke .6s}
.water{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--c) 22%,transparent);transition:height .3s linear}
.mid{position:relative;z-index:1;width:100%}
.lbl{font:400 30px/1.15 Jua,sans-serif;color:var(--ink);min-height:34px;max-width:94%;margin:0 auto 2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.big{font:700 112px/1 Outfit,Jua,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ink);transition:color .5s}
.big.low{color:var(--c)}
.big.pulse{animation:pl 1s ease-in-out infinite}
@keyframes pl{50%{opacity:.55}}
.track{width:84%;height:9px;border-radius:9px;background:var(--soft);margin:6px auto 0;overflow:hidden}
.track i{display:block;height:100%;width:100%;background:var(--c);border-radius:9px;transition:width .25s linear,background .5s}
.sub{font:400 17px Jua,sans-serif;color:var(--mut);margin-top:7px;min-height:24px}
/* 전체화면 */
body.fs .lbl{font-size:clamp(32px,6.5vh,72px);min-height:1.3em;white-space:normal}
body.fs .big{font-size:clamp(70px,min(24vw,36vh),380px)}
body.fs.v-ring .big{font-size:clamp(60px,min(15vw,20vh),240px)}
body.fs.v-ring .mid{transform:translateY(-5vh)}
body.fs .track{display:none}
body.fs.v-num .ring,body.fs.v-num .water{display:none}
body.fs .sub{font-size:clamp(16px,2.6vh,26px);margin-top:1vh}
/* 버튼 */
#ctl{position:absolute;left:0;right:0;bottom:6px;display:flex;gap:5px;justify-content:center;flex-wrap:wrap;opacity:0;transition:opacity .2s;z-index:3;-webkit-app-region:no-drag}
body.sm:hover #ctl,body.fs.act #ctl{opacity:1}
body.sm:hover .sub{visibility:hidden}
body.adjust #ctl,body.adjust #side,body.adjust #startBig{display:none}
/* 뽑기·설정은 다른 버튼과 구분되도록 오른쪽 위에 따로 */
#side{position:absolute;top:6px;right:8px;display:flex;gap:6px;opacity:0;transition:opacity .2s;z-index:4;-webkit-app-region:no-drag}
body.sm:hover #side,body.fs.act #side{opacity:1}
.sb{height:30px;border:0;border-radius:15px;font:400 14px Jua,sans-serif;cursor:pointer;box-shadow:0 1px 4px rgba(60,30,10,.25)}
.sb.pk{padding:0 12px;background:#f2b705;color:#3b2200}
.sb.pk:hover{background:#ffc928}
.sb.gr{width:30px;background:#6b5a4d;color:#fff;font-size:17px;line-height:30px;padding:0}
.sb.gr:hover{background:#4d3f35}
body.fs .sb{height:clamp(36px,5.5vh,56px);font-size:clamp(16px,2.6vh,26px);border-radius:999px}
body.fs .sb.gr{width:clamp(36px,5.5vh,56px);font-size:clamp(20px,3vh,32px)}
body.fs #side{top:2.5vh;right:2.5vw;gap:12px}
/* 처음 화면: 시간도 활동 이름도 보이지 않는 빈 타이머. 눌러서 시작 */
#startBig{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:44px;padding:0 20px;border:0;border-radius:22px;background:var(--c);color:#fff;font:400 20px Jua,sans-serif;cursor:pointer;opacity:0;transition:opacity .2s;z-index:3;-webkit-app-region:no-drag;box-shadow:0 2px 8px rgba(60,30,10,.3)}
body.blank #startBig{display:block}
body.blank:hover #startBig{opacity:1}
body.blank .mid,body.blank .ring,body.blank .water{visibility:hidden}
body.blank #ctl .b{display:none}
body.blank{cursor:pointer}
.b{height:30px;padding:0 10px;border:1px solid #e3cfb6;border-radius:10px;background:#fff;color:#5b3a24;font:400 14px Jua,sans-serif;cursor:pointer;white-space:nowrap}
.b:hover{background:#fff1dc}
.b.pri{background:var(--c);border-color:var(--c);color:#fff}
.fo{display:none}
body.fs #ctl{bottom:3vh;gap:10px}
body.fs .b{height:46px;padding:0 18px;font-size:18px;border-radius:14px}
body.fs .fo{display:inline-block}
body.fs .so{display:none}
body.fs.idle{cursor:none}
/* 위치 맞추기 */
#adj{display:none;position:absolute;inset:0;z-index:5;background:rgba(255,246,230,.97);flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:14px;font:400 15px/1.35 Jua,sans-serif;color:var(--ink)}
body.adjust #adj{display:flex}
#adj .b{-webkit-app-region:no-drag;height:34px;background:var(--c);color:#fff;border-color:var(--c)}
#grip{position:absolute;right:0;bottom:0;width:30px;height:30px;cursor:nwse-resize;-webkit-app-region:no-drag;background:linear-gradient(135deg,transparent 52%,var(--c) 52% 60%,transparent 60% 72%,var(--c) 72% 80%,transparent 80%)}
body.done .big{color:#e5484d}
body.done.sm .big{animation:pl 1.2s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.big.pulse,body.done.sm .big{animation:none}}
/* ---- 달리기 모드: 프레타운 친구가 결승 깃발까지 달려가요 (매번 다른 친구) ---- */
.race,.rocket,#fx{display:none}
body.fs.v-race .race,body.fs.v-rocket .rocket{display:block}
body.fs #fx{display:block}
.px{image-rendering:pixelated}
canvas.px{display:block}
body.fs.v-race{background:#5fc2fe var(--sky) center bottom/cover no-repeat}
body.fs.v-race .lbl,body.fs.v-race .big,body.fs.v-race .sub{color:#2b3a55;-webkit-text-stroke:.12em #fff;paint-order:stroke fill}
body.fs.v-race .big{-webkit-text-stroke:.07em #fff}
body.fs.v-race .big.low{color:var(--c)}
.race{position:absolute;left:0;right:0;bottom:0;height:40vh}
.forest{position:absolute;left:-3vw;right:-3vw;bottom:13vh;height:22vh;z-index:0}
.forest img{position:absolute;bottom:0;transform:translateX(-50%)}
.ground{position:absolute;left:0;right:0;bottom:0;height:15vh;background:linear-gradient(#7cc25a,#5fa848 30%,#4e9440)}
.ground::before{content:"";position:absolute;left:0;right:0;top:-1.2vh;height:1.6vh;background:repeating-linear-gradient(90deg,#7cc25a 0 1.2vh,transparent 1.2vh 2vh,#7cc25a 2vh 2.6vh,transparent 2.6vh 3.6vh);image-rendering:pixelated}
.ground img{position:absolute}
.rtrack{position:absolute;left:5vw;right:5vw;bottom:4vh;height:6.5vh;background:repeating-linear-gradient(90deg,#e7c08a 0 2vh,#dcb27a 2vh 4vh);border-top:.7vh solid #b98a55;border-bottom:.7vh solid #a2723f}
.rdone{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--c) 70%,#fff) 0 2vh,color-mix(in srgb,var(--c) 55%,#fff) 2vh 4vh);transition:width .25s linear,background .6s}
.rmark{position:absolute;bottom:11.5vh;transform:translateX(-50%);padding:.3vh 1vh;background:#fff8e8;border:.4vh solid #8a5a34;font:400 clamp(14px,2.2vh,22px) Jua,sans-serif;color:#5b3a24;z-index:1}
.rmark::after{content:"";position:absolute;left:50%;top:100%;width:.5vh;height:2vh;margin-left:-.25vh;background:#8a5a34}
.flag{position:absolute;right:2.5vw;bottom:9vh;height:15vh;transform-origin:15% 100%;z-index:1}
.runner{position:absolute;bottom:6.8vh;left:5vw;width:27vh;height:27vh;transform:translateX(-50%);transition:left .25s linear;z-index:2}
.runner canvas{width:100%;height:100%}
body.done .runner{animation:jump .7s ease-in-out infinite}
body.done .flag{animation:wave .6s ease-in-out infinite}
@keyframes jump{0%,100%{translate:0 0}40%{translate:0 -6vh}}
@keyframes wave{50%{transform:rotate(-10deg)}}
body.fs.v-race .mid{transform:translateY(-16vh)}
body.fs.v-race .big{font-size:clamp(60px,min(20vw,27vh),300px)}
/* ---- 로켓 모드: 프레타운 친구가 로켓 배낭을 메고 달까지 날아가요 (매번 다른 친구) ---- */
body.fs.v-rocket{background:#0b0f26}
body.fs.v-rocket .lbl,body.fs.v-rocket .big,body.fs.v-rocket .sub{color:#fff;-webkit-text-stroke:.12em #1c2a66;paint-order:stroke fill}
body.fs.v-rocket .big{-webkit-text-stroke:.07em #1c2a66}
body.fs.v-rocket .big.low{color:var(--c)}
body.fs.v-rocket .mid{align-self:flex-start;width:62%}
body.fs.v-rocket .big{font-size:clamp(60px,min(17vw,30vh),300px)}
.rocket{position:absolute;inset:0;overflow:hidden}
.world{position:absolute;left:0;right:0;bottom:0;height:300vh;transition:transform .25s linear;background:linear-gradient(to top,#5fc2fe 0 95vh,#4f9fe6 130vh,#3456a8 165vh,#1a2258 205vh,#0b0f26 250vh)}
.world .land{position:absolute;left:0;right:0;bottom:0;height:100vh;background:var(--sky) center bottom/cover no-repeat}
.world .cl{position:absolute}
.world .st{position:absolute}
.world .dot{position:absolute;width:.5vh;height:.5vh;background:#fff;animation:tw 2.4s steps(2) infinite}
@keyframes tw{50%{opacity:.2}}
.world .moon{position:absolute;right:4vw;bottom:194vh;width:56vh;height:56vh;filter:drop-shadow(0 0 5vh rgba(255,240,170,.45))}
.astro{position:absolute;right:calc(4vw + 11vh);bottom:10vh;width:34vh;height:34vh;transition:bottom .25s linear}
.astro .pack{position:absolute;left:50%;top:40%;height:65%;transform:translateX(-50%)}
.astro canvas{position:absolute;inset:0;width:100%;height:100%}
body.done .astro .pack{clip-path:inset(0 0 22% 0)}
.streak{position:absolute;width:.6vh;background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.7));opacity:0}
body.run .streak{animation:streak .6s linear infinite}
@keyframes streak{from{transform:translateY(-30vh);opacity:.9}to{transform:translateY(110vh);opacity:0}}
body.run .astro{animation:bobA .5s ease-in-out infinite}
body.run.hurry .astro{animation:shake .12s linear infinite}
body.done .astro{animation:land .5s ease-out 1}
@keyframes bobA{50%{translate:0 -1vh}}
@keyframes shake{25%{translate:-.5vh 0}75%{translate:.5vh 0}}
@keyframes land{0%{translate:0 -3vh}70%{translate:0 .6vh}100%{translate:0 0}}
body.fs.v-race .sub,body.fs.v-rocket .sub{-webkit-text-stroke:.08em currentColor;-webkit-text-stroke-color:inherit}
body.fs.v-race .sub{-webkit-text-stroke:.1em #fff}body.fs.v-rocket .sub{-webkit-text-stroke:.1em #1c2a66}
body.fs.v-race .big.pulse,body.fs.v-rocket .big.pulse{animation:pz 1s ease-in-out infinite}
@keyframes pz{50%{transform:scale(1.06)}}
/* ---- 끝났을 때 색종이 ---- */
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.cf{position:absolute;top:-4vh;width:1.4vh;height:2.2vh;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){.runner,.flag,.astro,.dot,.streak,.cf{animation:none!important}}
</style>
</head>

<script>
{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const B=document.body;
const ALERT_NAMES={600:'10분',300:'5분',180:'3분',60:'1분',30:'30초',10:'10초'};
let cfg={set:300,view:'ring',alerts:[300,60,10],snd:true,vol:70,preS:'ding',preRep:3,endS:'bell',endRep:2,label:'',pre:[30,60,180,300,600,900]};
const RT_DEF=[{id:'am',on:true,label:'아침 시간',days:[1,2,3,4,5],from:'',until:'08:55'},{id:'lunch',on:true,label:'점심 시간',days:[1,2,3,4,5],from:'12:10',until:'13:00'}];
let mode={full:false,adjust:false};
let blank=true,total=300000,remain=300000,running=false,endAt=0,done=false,doneAt=0,resAt=0,lastSec=null,sig='';

/* ---- 소리 ---- */
let ac,mg;
function A(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.connect(ac.destination)}if(ac.state!=='running')ac.resume()}catch(e){}if(mg)mg.gain.value=Math.pow(Math.max(0,Math.min(100,cfg.vol==null?70:cfg.vol))/100,1.6)*1.6;return ac}
function tone(f,d,type,v,when){try{const a=A(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(when||0);o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(mg);o.start(t);o.stop(t+d+.05)}catch(e){}}
/* 미리 알림 소리 (끝 소리와 다르게: 짧고 가벼운 소리) */
let sndT=[];
function clearSnd(){sndT.forEach(clearTimeout);sndT=[]}
function rep(fn,n,gap){if(!cfg.snd)return;n=Math.max(1,Math.min(10,n|0||1));for(let i=0;i<n;i++){if(i===0)fn();else sndT.push(setTimeout(fn,i*gap))}}
const preSound=()=>rep(preOnce,cfg.preRep==null?3:cfg.preRep,1300);
function preOnce(){const s=cfg.preS||'ding';
  if(s==='ding'){tone(880,.6,'sine',.4);tone(1320,.8,'sine',.25,.2)}
  else if(s==='pop'){tone(660,.18,'triangle',.45);tone(990,.25,'triangle',.4,.16)}
  else if(s==='knock'){tone(220,.18,'square',.25);tone(220,.18,'square',.25,.25)}
  else{[0,.25,.5].forEach(w=>tone(1200,.15,'sine',.4,w))}}
const beep=()=>{if(cfg.snd)tone(1000,.12,'sine',.25)};
const endSound=()=>rep(endOnce,cfg.endRep==null?2:cfg.endRep,{bell:3600,chime:4000,soft:2600}[cfg.endS||'bell']);
function endOnce(){
  if(cfg.endS==='bell'){for(let r=0;r<3;r++){tone(1046,1.4,'sine',.4,r*1.1);tone(1568,1.2,'sine',.15,r*1.1);tone(523,1.6,'triangle',.2,r*1.1)}}
  else if(cfg.endS==='chime'){[784,659,523,392].forEach((f,i)=>{tone(f,1,'sine',.4,i*.45);tone(f,1,'sine',.3,2+i*.45)})}
  else{[523,659,784].forEach((f,i)=>tone(f,1.6,'sine',.25,i*.35))}}

/* ---- 표시 ---- */
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0')};
const kst=(d,sec)=>d.toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',second:sec?'2-digit':undefined});
function fit(){document.body.style.zoom=B.classList.contains('sm')?Math.min(innerWidth/450,innerHeight/244):1}
function color(){const s=remain/1000;return done||s<=10?'#e5484d':s<=60?'#f08c00':'#a65e2e'}
function paint(){
  B.classList.toggle('sm',!mode.full);B.classList.toggle('fs',mode.full);B.classList.toggle('adjust',mode.adjust);B.classList.toggle('done',done);B.classList.toggle('blank',blank&&!running&&!done&&!resAt&&!mode.full&&!mode.adjust);
  B.classList.remove('v-ring','v-water','v-num','v-race','v-rocket');B.classList.toggle('run',running);B.classList.toggle('hurry',running&&remain<=10000);B.classList.add('v-'+(cfg.view||'ring'));
  document.documentElement.style.setProperty('--c',color());
  const f=total>0?Math.max(0,Math.min(1,remain/total)):0;
  $('#fg').style.strokeDashoffset=565.49*(1-f);$('#water').style.height=(f*100)+'%';$('#bar').style.width=(f*100)+'%';
  const g=1-f;$('#rdone').style.width=(g*100)+'%';$('#runner').style.left=`calc(5vw + 8vh + ${g} * (90vw - 22vh))`;
  $('#world').style.transform=`translateY(${g*200}vh)`;$('#astro').style.bottom=`calc(10vh + ${g} * 38vh)`;
  spriteTick();
  const big=$('#big');
  big.textContent=done?'끝!':fmt(remain);
  big.className='big'+(remain<=60000||done?' low':'')+(running&&remain<=10000?' pulse':'');
  $('#lbl').textContent=cfg.label||'';
  let sub='';
  if(done)sub='';
  else if(resAt)sub=`${kst(new Date(resAt))} 시작 예약 · ${fmt(resAt-Date.now())} 남음`;
  else if(running)sub=`${kst(new Date(endAt))}에 끝나요`;
  else if(remain<total)sub='잠시 멈춤';
  $('#sub').textContent=sub;
  $('#bt').textContent=running?'멈춤':done?'다시':remain<total?'계속':'시작';
  $('#bf').textContent=mode.full?'작게':'크게';
  fit();
}
function sendState(){
  const s=[running,done,Math.ceil(remain/1000),resAt,cfg.set].join();
  if(s===sig)return;sig=s;
  api.state({running,done,remain,total,resAt,set:cfg.set});
}

/* ---- 동작 ---- */
function start(){A();clearSnd();blank=false;if(done||remain<=0){remain=total;done=false}if(remain>=total)pickChars();running=true;endAt=Date.now()+remain;lastSec=Math.ceil(remain/1000);paint()}
function pause(){if(!running)return;remain=Math.max(0,endAt-Date.now());running=false;paint()}
function reset(){clearSnd();$('#fx').innerHTML='';blank=true;running=false;done=false;total=cfg.set*1000;remain=total;paint()}
function setTime(sec,go){sec=Math.max(1,Math.min(10800,sec|0));cfg.set=sec;api.cfgSet({set:sec});reset();blank=false;if(go)start()}
function adj(d){
  if(done){done=false;total=d>0?d*1000:total;remain=d>0?d*1000:0;if(d>0)start();return}
  if(running)remain=endAt-Date.now();
  remain=Math.max(1000,remain+d*1000);if(d>0)total+=d*1000;if(remain>total)total=remain;
  if(running){endAt=Date.now()+remain;lastSec=Math.ceil(remain/1000)}
  paint();
}
function finish(){running=false;done=true;doneAt=Date.now();remain=0;endSound();paint();party()}

  const r=$('.rocket');for(let i=0;i<8;i++){const d=document.createElement('i');d.className='streak';d.style.cssText=`left:${rnd(55,98)}vw;top:0;height:${rnd(8,18)}vh;animation-delay:${rnd(0,.6)}s`;r.appendChild(d)}}

/* ---- 루틴: 정해 둔 시각에 자동으로 타이머를 켜요 (한국 시간 기준) ---- */
const hm=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?+m[1]*60+ +m[2]:null};
let rtDone={};
function routineTick(){
  if(running||resAt||mode.adjust)return;
  const k=new Date(Date.now()+(540+new Date().getTimezoneOffset())*60000);
  const day=k.getDay(),mins=k.getHours()*60+k.getMinutes()+k.getSeconds()/60,dk=k.getFullYear()+'-'+k.getMonth()+'-'+k.getDate();
  for(const r of (cfg.routines||RT_DEF)){
    if(!r.on||rtDone[r.id]===dk||!(r.days||[1,2,3,4,5]).includes(day))continue;
    const u=hm(r.until),f=r.from?hm(r.from):0;
    if(u==null||f==null||mins<f||mins>=u)continue;
    rtDone[r.id]=dk;
    const now=Date.now(),endMs=now+(u-mins)*60000,startMs=r.from?now-(mins-f)*60000:now;
    clearSnd();pickChars();total=endMs-startMs;remain=endMs-now;done=false;running=true;endAt=endMs;lastSec=Math.ceil(remain/1000);
    api.cfgSet({label:r.label,labelSel:r.label});paint();break;
  }
}
function endAuto(){ // 끝난 화면이 계속 남지 않도록, 정한 시간이 지나면 처음 화면으로
  const h=cfg.endHold==null?60:cfg.endHold;
  if(!done||!h||Date.now()-doneAt<h*1000)return;
  clearSnd();reset();api.cfgSet({label:'',labelSel:''});if(mode.full)api.cmd('full',false);
}
function loop(){endAuto();routineTick();
  const now=Date.now();
  if(resAt&&now>=resAt){resAt=0;preSound();reset();start()}
  if(running){
    remain=endAt-now;const sec=Math.ceil(remain/1000);
    if(lastSec!==null&&sec<lastSec){
      for(const th of cfg.alerts){if(lastSec>th&&sec<=th&&total/1000>=th&&!(th*1000===total&&lastSec*1000>=total)){preSound()}}
      if(sec<=5&&sec>0)beep();
    }
    lastSec=sec;
    if(remain<=0)finish();
  }
  paint();sendState();
}

/* ---- 명령 받기 ---- */
api.on('cmd',({name,arg})=>{
  A();
  if(name==='start')start();else if(name==='pause')pause();else if(name==='toggle')running?pause():start();
  else if(name==='reset')reset();else if(name==='set')setTime(arg.sec,arg.go);else if(name==='adj')adj(arg);
  else if(name==='resIn'){resAt=Date.now()+Math.max(1,arg)*60000;reset()}
  else if(name==='resAt'){const d=new Date();d.setHours(arg.h,arg.m,0,0);if(d<=new Date())d.setDate(d.getDate()+1);resAt=d.getTime();reset()}
  else if(name==='resCancel'){resAt=0;paint()}
  else if(name==='test'){clearSnd();arg==='pre'?preSound():endSound()}
  sig='';
});
api.on('cfg',c=>{const keep=cfg.set;cfg=c;A();if(cfg.set!==keep&&!running&&!done&&remain===total){total=cfg.set*1000;remain=total}paint()});
api.on('mode',m=>{mode=m;paint()});

/* ---- 화면 조작 ---- */
$('#side').onclick=e=>{const a=e.target.dataset.a;if(a==='picker')api.open('picker');else if(a==='settings')api.open('settings')};
$('#startBig').onclick=()=>{blank=false;start()};
document.body.addEventListener('click',e=>{if(B.classList.contains('blank')&&!e.target.closest('#side,#ctl')){blank=false;start()}});
$('#ctl').onclick=e=>{const a=e.target.dataset.a;if(!a)return;
  if(a==='toggle')running?pause():start();else if(a==='reset')reset();
  else if(a==='full')api.cmd('full',!mode.full);else if(a==='picker')api.open('picker');else if(a==='settings')api.open('settings');
  else adj(+a)};
$('#stage').ondblclick=()=>api.cmd('full',!mode.full);
addEventListener('contextmenu',e=>{e.preventDefault();api.ctx()});
$('#adone').onclick=()=>api.cmd('adjdone');
let actT;
addEventListener('mousemove',()=>{if(!mode.full)return;B.classList.add('act');B.classList.remove('idle');clearTimeout(actT);actT=setTimeout(()=>{B.classList.remove('act');B.classList.add('idle')},3000)});
addEventListener('keydown',e=>{
  if(mode.adjust){const k={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(k){api.adjNudge(k[0]*(e.shiftKey?10:1),k[1]*(e.shiftKey?10:1));e.preventDefault()}if(e.key==='Enter'||e.key==='Escape')api.cmd('adjdone');return}
  if(e.code==='Space'){e.preventDefault();running?pause():start()}
  else if(e.key==='ArrowUp')adj(60);else if(e.key==='ArrowDown')adj(-60);else if(e.key==='ArrowRight')adj(10);else if(e.key==='ArrowLeft')adj(-10);
  else if(e.key==='f'||e.key==='F')api.cmd('full',!mode.full);
  else if(e.key==='Escape'&&mode.full)api.cmd('full',false);
});
/* 크기 조절 손잡이 */
const grip=$('#grip');let gs=null;
grip.onpointerdown=e=>{grip.setPointerCapture(e.pointerId);gs={x:e.screenX,w:outerWidth}};
grip.onpointermove=e=>{if(!gs)return;const w=Math.max(220,gs.w+(e.screenX-gs.x));api.adjSize(w,Math.round(w*244/450))};
grip.onpointerup=()=>{gs=null};
addEventListener('resize',fit);

api.cfgGet().then(c=>{cfg=c;total=remain=cfg.set*1000;paint()});
setInterval(loop,200);paint();
}
</script>
