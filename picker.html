<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>발표자 뽑기</title>
<link rel="stylesheet" href="fonts/jua/400.css">
<style>
/* 무대 위에서 벌어지는 뽑기 쇼. 조작부는 차분하게, 무대는 화려하게 */
:root{--bg:#fbf8f6;--ink:#24161c;--card:#fff;--line:#ecdfe4;--mut:#7d6a71;--red:#7a1630;--red2:#a8204a;--gold:#f2b705}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Jua,"Malgun Gothic",system-ui,sans-serif;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding:14px 18px 36px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
h1{font:400 clamp(26px,4vw,34px)/1.05 Jua,sans-serif;margin:0;color:var(--red2)}
h2{font:400 20px/1.2 Jua,sans-serif;margin:0 0 10px}
button,input,textarea{font:inherit}
.ib{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;min-height:42px;padding:0 14px;font-size:15px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* 무대 */
.stage{position:relative;height:clamp(320px,54vh,540px);border-radius:22px;overflow:hidden;background:radial-gradient(ellipse 60% 70% at 50% -10%,rgba(255,226,140,.4),transparent 70%),linear-gradient(#2b0a15,#120408);isolation:isolate;transition:filter .4s}
.stage.dim{filter:brightness(.55)}
.stage.shake{animation:shk .12s linear infinite}
@keyframes shk{0%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-3px)}100%{transform:translate(0,0)}}
.stage::before,.stage::after{content:"";position:absolute;top:0;bottom:0;width:11%;z-index:2;background:repeating-linear-gradient(90deg,#5c0f24 0 10px,#8d1b3a 18px,#5c0f24 30px);box-shadow:inset -10px 0 20px rgba(0,0,0,.45)}
.stage::before{left:0;border-bottom-right-radius:60% 12%}
.stage::after{right:0;transform:scaleX(-1);border-bottom-right-radius:60% 12%}
.val{position:absolute;inset:0 0 auto 0;height:34px;z-index:3;background:radial-gradient(circle at 50% 0,#9a1f41 22px,transparent 23px) 0 0/46px 34px repeat-x,linear-gradient(#7a1630,#7a1630) 0 0/100% 12px no-repeat}
.floor{position:absolute;left:10%;right:10%;bottom:-40px;height:120px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,220,130,.35),transparent 70%)}
.beams i{position:absolute;top:30px;width:150px;height:130%;left:30%;transform-origin:50% 0;background:linear-gradient(rgba(255,235,170,.38),transparent 80%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);opacity:0;transition:opacity .5s;z-index:0}
.beams i+i{left:58%}
.stage.live .beams i{opacity:1;animation:sway 2.2s ease-in-out infinite alternate}
.stage.live .beams i+i{animation-delay:-1.1s;animation-direction:alternate-reverse}
@keyframes sway{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
.show{position:absolute;inset:34px 12% 0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:1;padding:10px}
.name{font:400 clamp(60px,13vw,150px)/1.02 Jua,sans-serif;color:#fff;text-shadow:0 0 30px rgba(242,183,5,.55),0 4px 0 rgba(0,0,0,.35);word-break:keep-all;text-wrap:balance}
.name.many{font-size:clamp(34px,6.5vw,76px)}
.name.spin{color:#ffe9a8}
.name.pop{animation:pop .7s cubic-bezier(.2,1.6,.35,1)}
.name.boom{animation:boom .95s ease-out}
.name.fake{color:#9fd8ff;animation:pop .5s cubic-bezier(.2,1.6,.35,1)}
.name.wob{animation:wob .5s linear}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes boom{0%{transform:scale(2.3);opacity:0}25%{opacity:1}100%{transform:scale(1)}}
@keyframes wob{0%,100%{transform:translateX(0)}20%{transform:translateX(-18px) rotate(-3deg)}40%{transform:translateX(18px) rotate(3deg)}60%{transform:translateX(-12px)}80%{transform:translateX(12px)}}
.cap{color:#f6d77a;font:400 clamp(17px,2.4vw,24px) Jua,sans-serif;margin-top:6px;min-height:1.3em;position:relative;z-index:4}
.got{position:absolute;left:14%;right:14%;bottom:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;z-index:4}
.got span{background:rgba(242,183,5,.92);color:#2b0a15;padding:3px 14px;border-radius:999px;font:400 18px Jua,sans-serif}
.field{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-height:100%;overflow:hidden}
.field span{font:400 clamp(16px,2.2vw,22px) Jua,sans-serif;color:rgba(255,255,255,.45);padding:6px 12px;border-radius:999px;transition:all .12s}
.field span.on{color:#2b0a15;background:var(--gold);box-shadow:0 0 28px 6px rgba(242,183,5,.7);transform:scale(1.15)}
#wheel{position:absolute;left:50%;top:50%;transform:translate(-50%,-47%);z-index:1}
.cov{position:absolute;inset:0;z-index:5;pointer-events:none}
.cov i{position:absolute;top:0;bottom:0;width:50.5%;background:repeating-linear-gradient(90deg,#6a1228 0 14px,#9c2043 24px,#6a1228 40px);box-shadow:inset 0 0 40px rgba(0,0,0,.5);transition:transform .8s cubic-bezier(.6,0,.3,1)}
.cov .l{left:0;transform:translateX(-101%)}.cov .r{right:0;transform:translateX(101%)}
.cov.closed .l,.cov.closed .r{transform:none;transition-duration:.55s}
.cov b{position:absolute;inset:0;display:grid;place-items:center;font:400 clamp(30px,6vw,64px) Jua,sans-serif;color:#ffe9a8;text-shadow:0 3px 0 rgba(0,0,0,.4);opacity:0;transition:opacity .3s;z-index:2}
.cov.closed b{opacity:1}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
.pulse{position:absolute;left:50%;top:52%;width:80px;height:80px;margin:-40px;border:6px solid var(--gold);border-radius:50%;z-index:1;animation:pl .9s ease-out forwards;pointer-events:none}
@keyframes pl{to{transform:scale(9);opacity:0}}
.flash{position:absolute;inset:0;background:#fff;z-index:6;pointer-events:none;animation:fl .5s ease-out forwards}
@keyframes fl{from{opacity:.9}to{opacity:0}}
.skip{position:absolute;right:13%;bottom:12px;z-index:8;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;min-height:40px;padding:0 16px;cursor:pointer}
[hidden]{display:none!important}
/* 조작 */
.bar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;margin:14px 0 10px}
.go{background:var(--gold);color:#2b0a15;border:0;border-radius:16px;min-height:60px;padding:0 36px;font:400 26px Jua,sans-serif;cursor:pointer;box-shadow:0 5px 0 #b98a00}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #b98a00}
.go:disabled{opacity:.5}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--ink);font-size:15px;min-height:42px;padding:0 13px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--red);color:#fff}
.seg.wrap{flex-wrap:wrap;gap:6px;border:0;background:none;overflow:visible}
.seg.wrap button{border:1px solid var(--line);border-radius:12px;background:var(--card)}
.seg.wrap button[aria-pressed=true]{border-color:var(--red);background:var(--red);color:#fff}
.opts{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-bottom:16px}
.cnt{display:inline-flex;align-items:center;gap:6px;font-size:15px}
.cnt button{width:40px;min-height:42px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:20px;cursor:pointer}
.cnt b{min-width:2ch;text-align:center;font-size:18px;font-weight:400}
label.tg{display:inline-flex;align-items:center;gap:6px;font-size:15px;min-height:42px;cursor:pointer}
label.tg input{width:20px;height:20px;accent-color:var(--red)}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
input[type=number]{width:84px;min-height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:16px;background:var(--bg);color:var(--ink)}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;background:var(--bg);color:var(--ink);resize:vertical}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:6px}
.chip{min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:400 17px Jua,sans-serif;cursor:pointer;padding:0 6px}
.chip.off{opacity:.38;text-decoration:line-through;background:transparent}
.hint{color:var(--mut);font-size:14px;margin:6px 0 0}
.hist{list-style:none;margin:0;padding:0;max-height:360px;overflow:auto}
.hist li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.hist time{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px;padding-top:2px}
.hist span{font-size:18px}
.empty{color:var(--mut);font-size:15px}
/* 역할별 화면: stage=학생 TV 무대, control=선생님 조작 */
.r-stage{background:#120408;overflow:hidden}
.r-stage .wrap{max-width:none;padding:0}
.r-stage header,.r-stage .bar,.r-stage .opts,.r-stage .grid,.r-stage #ctlStat,.r-stage #skip{display:none!important}
.r-stage .stage{height:100vh;border-radius:0}
.r-control .stage,.r-control #fs{display:none}
#ctlStat{display:none;margin-bottom:6px}
.r-control #ctlStat{display:block}
#cs{font:400 clamp(30px,5vw,60px)/1.1 Jua,sans-serif;color:var(--red2)}
/* 선생님 조작 화면: 왼쪽에 조작, 오른쪽에 기록을 나란히 */
@media(min-width:1000px){
.r-control>.wrap{max-width:1500px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);column-gap:16px;align-content:start}
.r-control header{grid-column:1/-1}
.r-control #ctlStat,.r-control .bar,.r-control .opts{grid-column:1}
.r-control .grid{display:contents}
.r-control .grid>.card:first-child{grid-column:1}
.r-control .grid>.card:last-child{grid-column:2;grid-row:2/span 4}
.r-control .hist{max-height:none}
}
@media(max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){.stage.shake,.stage.live .beams i{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>오늘의 발표자는?</h1>
    <div class="row" style="margin:0">
      <label class="tg"><input type="checkbox" id="snd"> 효과음</label>
      <button class="ib" id="fs">전체화면 (F)</button>
    </div>
  </header>

  <section class="stage" id="stage" aria-live="polite">
    <div class="beams"><i></i><i></i></div>
    <div class="val"></div><div class="floor"></div>
    <div class="show">
      <canvas id="wheel" hidden></canvas>
      <div class="field" id="field" hidden></div>
      <div class="name" id="name">?</div>
      <div class="cap" id="cap">뽑기 버튼(또는 스페이스바)을 눌러요</div>
    </div>
    <div class="got" id="got"></div>
    <div class="cov" id="cov"><i class="l"></i><i class="r"></i><b>두구두구두구…</b></div>
    <canvas id="fx"></canvas>
    <button class="skip" id="skip" hidden>연출 건너뛰기 ▶▶</button>
  </section>

  <section class="card" id="ctlStat">
    <h2>학생 화면(TV) 무대</h2>
    <div id="cs">준비됨</div>
    <div class="hint" id="cs2">뽑기 버튼을 누르면 학생 화면에서 연출이 시작돼요. 이 창은 선생님 화면에만 보여요.</div>
    <div class="row" style="margin-top:8px"><button class="ib" id="skipC" hidden>연출 건너뛰기 ▶▶</button>
      <label class="tg" style="gap:8px">학생 화면(TV) 높이 <select id="stageH" aria-label="학생 화면 높이" style="min-height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:16px;background:var(--bg);color:var(--ink)"><option value="60">작게</option><option value="70">조금 작게</option><option value="78">보통</option><option value="92">크게</option></select></label></div>
  </section>

  <div class="bar">
    <button class="go" id="go">뽑기!</button>
    <div class="seg wrap" id="anim" role="group" aria-label="연출">
      <button data-v="random">랜덤 연출</button><button data-v="slot">슬롯머신</button><button data-v="spot">스포트라이트</button><button data-v="roulette">룰렛</button><button data-v="count">카운트다운</button><button data-v="curtain">커튼</button><button data-v="instant">바로 뽑기</button>
    </div>
  </div>
  <div class="opts">
    <div class="seg" id="spd" role="group" aria-label="속도"><button data-v="fast">빠르게</button><button data-v="normal">보통</button><button data-v="slow">느긋하게</button></div>
    <div class="cnt">몇 명 <button id="m">−</button><b id="cntv">1</b><button id="p">+</button></div>
    <label class="tg"><input type="checkbox" id="auto"> 뽑힌 사람은 다음에서 빼기</label>
    <label class="tg"><input type="checkbox" id="fake"> 가짜 당첨 먼저 보여주기</label>
  </div>

  <div class="grid">
    <section class="card">
      <h2>명단</h2>
      <div class="row">
        <div class="seg" id="mode" role="group" aria-label="명단 방식"><button data-v="num">번호</button><button data-v="name">이름</button></div>
        <span id="numBox">1번부터 <input type="number" id="n" min="1" max="99">번까지</span>
      </div>
      <div id="nameBox" hidden>
        <textarea id="names" placeholder="한 줄에 한 명씩, 또는 쉼표로 구분해서 입력"></textarea>
        <div class="row" style="margin-top:8px"><button class="ib" id="apply">이름 명단 적용</button></div>
      </div>
      <div class="row" style="justify-content:space-between;margin:8px 0 0">
        <b id="left" style="font-weight:400"></b>
        <button class="ib" id="clrEx">빠진 사람 모두 되돌리기</button>
      </div>
      <div class="chips" id="chips"></div>
      <p class="hint">이름(번호)을 누르면 뽑기에서 빠지고, 다시 누르면 돌아와요. 결석생이나 이미 발표한 친구를 뺄 때 쓰세요.</p>
    </section>
    <section class="card">
      <div class="row" style="justify-content:space-between"><h2 style="margin:0">최근 24시간 기록</h2><button class="ib" id="clrH">기록 지우기</button></div>
      <ul class="hist" id="hist"></ul>
    </section>
  </div>
</div>

<script>
{
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DAY=864e5;
let st=Object.assign({mode:'num',n:25,names:'',ex:[],anim:'random',cnt:1,auto:true,snd:true,fake:false,spd:'normal'},LS.get('pk_state',{}));
let hist=LS.get('pk_hist',[]).filter(h=>Date.now()-h.t<DAY);
const ROLE=(location.search.match(/role=(\w+)/)||[])[1]||'both';
document.body.classList.add('r-'+ROLE);
if(ROLE==='control'&&window.api){api.cfgGet().then(c=>{$('#stageH').value=String((c&&c.stageH)||78)});$('#stageH').onchange=e=>api.cfgSet({stageH:+e.target.value})}
let wd=0;
let busy=false,timers=[],skipFn=null,raf=0,cfRaf=0,fakeUsed=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lab=x=>st.mode==='num'?x+'번':x;
const save=()=>{LS.set('pk_state',st);LS.set('pk_hist',hist)};
const SPD=()=>({fast:.55,normal:1,slow:1.6}[st.spd]||1);
const later=(f,ms)=>timers.push(setTimeout(f,ms));
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function roster(){return st.mode==='num'?Array.from({length:Math.max(1,Math.min(99,st.n|0))},(_,i)=>String(i+1)):[...new Set(st.names.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean))]}
function pool(){const ex=new Set(st.ex);return roster().filter(x=>!ex.has(x))}
function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function choose(p,k){const a=[...p];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,k)}

/* ---------- 효과음 (파일 없이 직접 합성) ---------- */
let ac;
function A(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}return ac}
function tone(f,d,type,v,when){if(!st.snd)return;try{const a=A(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(when||0);o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
function noise(dur,fn){if(!st.snd)return;try{const a=A(),len=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;fn(a,s,a.currentTime,dur)}catch(e){}}
const tick=(f)=>tone(f||1150,.035,'square',.06);
function drum(dur){noise(dur,(a,s,t)=>{const f=a.createBiquadFilter(),g=a.createGain();f.type='lowpass';f.frequency.value=1000;const n=Math.floor(dur*24);for(let i=0;i<n;i++){const x=t+i/24;g.gain.setValueAtTime(.12+.5*i/n,x);g.gain.exponentialRampToValueAtTime(.01,x+.035)}s.connect(f).connect(g).connect(a.destination);s.start(t)})}
function riser(dur){noise(dur,(a,s,t)=>{const f=a.createBiquadFilter(),g=a.createGain();f.type='bandpass';f.Q.value=4;f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(4200,t+dur);g.gain.setValueAtTime(.02,t);g.gain.linearRampToValueAtTime(.3,t+dur);g.gain.linearRampToValueAtTime(0,t+dur+.1);s.connect(f).connect(g).connect(a.destination);s.start(t)})}
function whoosh(){noise(.7,(a,s,t)=>{const f=a.createBiquadFilter(),g=a.createGain();f.type='highpass';f.frequency.setValueAtTime(5000,t);f.frequency.exponentialRampToValueAtTime(400,t+.7);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.01,t+.7);s.connect(f).connect(g).connect(a.destination);s.start(t)})}
function thump(){tone(62,.2,'sine',.6);tone(62,.2,'sine',.45,.17)}
function hit(big){tone(big?60:95,.6,'sine',.6);tone(big?45:70,.5,'triangle',.3);noise(.15,(a,s,t)=>{const g=a.createGain();g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.01,t+.15);s.connect(g).connect(a.destination);s.start(t)})}
function womp(){[392,330,262,196].forEach((f,i)=>tone(f,.3,'sawtooth',.1,i*.2))}
function fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,i===3?.9:.2,'triangle',.22,i*.11));tone(1568,.7,'sine',.08,.33);tone(2093,.5,'sine',.05,.5)}

/* ---------- 화면 효과 ---------- */
function confetti(n){
  if(calm)n=Math.min(n||150,30);n=n||150;
  const cv=$('#fx'),W=cv.clientWidth,H=cv.clientHeight;cv.width=W;cv.height=H;const c=cv.getContext('2d');
  const cols=['#f2b705','#e8604c','#2f8f83','#ffffff','#f08c00','#8fc7ff','#ff7eb6'];
  const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.25,y:H*.52,vx:(Math.random()-.5)*16,vy:-Math.random()*17-4,s:6+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.4,col:cols[rnd(cols.length)]}));
  cancelAnimationFrame(cfRaf);let f=0;
  (function loop(){c.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.36;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.col;c.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);c.restore()});
    if(++f<170)cfRaf=requestAnimationFrame(loop);else c.clearRect(0,0,W,H)})();
}
function pulse(){const e=document.createElement('i');e.className='pulse';$('#stage').appendChild(e);setTimeout(()=>e.remove(),950)}
function flash(){const e=document.createElement('i');e.className='flash';$('#stage').appendChild(e);setTimeout(()=>e.remove(),520)}
function setName(t,cls){const n=$('#name');n.textContent=t;n.className='name'+(cls?' '+cls:'');void n.offsetWidth;return n}
const big=x=>lab(x).length>4?' many':'';
function live(on){$('#stage').classList.toggle('live',on)}

/* 당첨 공개 (모든 연출의 마지막에 불림) */
function reveal(rest,w,done){
  const go=()=>{
    $('#field').hidden=true;$('#wheel').hidden=true;$('#stage').classList.remove('dim','shake');live(false);
    setName(lab(w),'pop'+big(w));$('#cap').textContent='나와 주세요!';
    fanfare();confetti();flash();
    const g=document.createElement('span');g.textContent=lab(w);$('#got').appendChild(g);
    done(w);
  };
  const other=rest.filter(x=>x!==w);
  if(st.fake&&!fakeUsed&&other.length){
    fakeUsed=true;$('#field').hidden=true;$('#wheel').hidden=true;$('#stage').classList.remove('dim');
    const o=other[rnd(other.length)];
    setName(lab(o),'fake'+big(o));$('#cap').textContent='당첨?!';tone(880,.3,'triangle',.2);tone(1320,.4,'triangle',.15,.12);
    later(()=>{setName(lab(o),'wob fake'+big(o));$('#cap').textContent='…어? 잠깐만요!';womp()},1400*SPD());
    later(()=>{$('#name').textContent='?';$('#name').className='name';$('#stage').classList.add('dim');$('#cap').textContent='진짜 주인공은 따로 있었어요…';drum(1.3)},2300*SPD());
    later(go,3700*SPD());
  }else go();
}

/* 1) 슬롯머신: 이름이 휙휙 지나가다 천천히 멈춰요 */
function slot(rest,w,done){
  let d=45;const r=1+.09/SPD();
  setName('?','spin'+(rest.some(x=>lab(x).length>4)?' many':''));$('#cap').textContent='두구두구…';live(true);
  const step=()=>{
    $('#name').textContent=lab(rest[rnd(rest.length)]);tick();d*=r;
    if(d<400)later(step,d);
    else{setName('?');$('#cap').textContent='과연 누구일까요?';$('#stage').classList.add('dim');riser(1.6);drum(1.6);later(()=>reveal(rest,w,done),1600)}
  };step();
}
/* 2) 스포트라이트: 조명이 이름들 사이를 돌아다녀요 */
function spot(rest,w,done){
  if(rest.length>45)return slot(rest,w,done);
  const box=$('#field');box.innerHTML=rest.map(x=>`<span>${esc(lab(x))}</span>`).join('');box.hidden=false;
  setName('');$('#cap').textContent='조명이 누구에게 멈출까요?';live(true);
  const els=[...box.children],wi=rest.indexOf(w);let d=70,cur=-1;const r=1+.1/SPD();
  const step=()=>{
    let n;d*=r;
    if(d>=420)n=wi;else{do{n=rnd(els.length)}while(n===cur&&els.length>1)}
    els.forEach(e=>e.classList.remove('on'));els[n].classList.add('on');cur=n;tick(900+n*20);
    if(d<420)later(step,d);
    else{$('#cap').textContent='바로 이 사람!';drum(1.2);later(()=>reveal(rest,w,done),1300)}
  };step();
}
/* 3) 룰렛: 원판이 돌다가 화살표 아래에서 멈춰요 */
function roulette(rest,w,done){
  const cv=$('#wheel'),stg=$('#stage');
  const S=Math.round(Math.min(stg.clientHeight-40,stg.clientWidth*.7)),dpr=devicePixelRatio||1;
  cv.style.width=cv.style.height=S+'px';cv.width=cv.height=Math.round(S*dpr);cv.hidden=false;
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  const n=rest.length,seg=2*Math.PI/n,wi=rest.indexOf(w),TAU=2*Math.PI;
  const cols=['#f2b705','#e8604c','#2f8f83','#7a1630','#f08c00','#4b6cb7'],dark=['#f2b705','#f08c00'];
  const col=i=>(i===n-1&&n%cols.length===1)?cols[2]:cols[i%cols.length];
  let base=-Math.PI/2-(wi+.5+(Math.random()-.5)*.7)*seg;base=((base%TAU)+TAU)%TAU;
  const final=base+(5+rnd(3))*TAU,dur=5200*SPD();
  setName('');$('#name').hidden=true;$('#cap').textContent='';live(true);
  const R=S/2-14;
  const paint=(rot,idx)=>{
    c.clearRect(0,0,S,S);c.save();c.translate(S/2,S/2);c.rotate(rot);
    for(let i=0;i<n;i++){c.beginPath();c.moveTo(0,0);c.arc(0,0,R,i*seg,(i+1)*seg);c.closePath();c.fillStyle=col(i);c.fill();c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=2;c.stroke();
      if(n<=60){c.save();c.rotate((i+.5)*seg);c.fillStyle=dark.includes(col(i))?'#2b0a15':'#fff';c.font=`${Math.max(11,Math.min(30,R*TAU/n*.5))}px Jua,sans-serif`;c.textAlign='right';c.textBaseline='middle';c.fillText(lab(rest[i]),R-14,0);c.restore()}}
    c.restore();c.save();c.translate(S/2,S/2);
    c.beginPath();c.arc(0,0,R+5,0,TAU);c.lineWidth=10;c.strokeStyle='#f2b705';c.stroke();
    c.beginPath();c.arc(0,0,R*.26,0,TAU);c.fillStyle='#2b0a15';c.fill();c.lineWidth=4;c.strokeStyle='#f2b705';c.stroke();
    c.fillStyle='#fff';c.font=`${R*.16}px Jua,sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(lab(rest[idx]),0,2);
    c.restore();
    c.fillStyle='#e5484d';c.strokeStyle='#fff';c.lineWidth=3;c.beginPath();c.moveTo(S/2-15,2);c.lineTo(S/2+15,2);c.lineTo(S/2,36);c.closePath();c.fill();c.stroke();
  };
  let t0=0,last=-1;
  const frame=ts=>{
    if(!t0)t0=ts;const k=Math.min(1,(ts-t0)/dur),rot=final*(1-Math.pow(1-k,4));
    const idx=Math.floor((((-Math.PI/2-rot)%TAU)+TAU)%TAU/seg)%n;
    if(idx!==last){last=idx;tick(700+900*(1-k))}
    paint(rot,idx);
    if(k<1)raf=requestAnimationFrame(frame);
    else later(()=>{$('#name').hidden=false;reveal(rest,w,done)},900);
  };raf=requestAnimationFrame(frame);
}
/* 4) 카운트다운: 3, 2, 1 쾅! */
function count(rest,w,done){
  let n=3;$('#cap').textContent='준비하세요…';$('#stage').classList.add('dim');live(true);
  const step=()=>{
    if(n>0){setName(n,'boom');hit(n===1);pulse();$('#stage').classList.remove('dim');n--;later(step,1000*SPD())}
    else{flash();riser(.01);reveal(rest,w,done)}
  };step();
}
/* 5) 커튼: 커튼이 닫혀 두근두근, 열리면 짜잔 */
function curtain(rest,w,done){
  setName(lab(w),big(w).trim());$('#cap').textContent='';live(true);
  const cov=$('#cov');cov.className='cov closed';$('#stage').classList.add('shake');
  const T=2400*SPD();let d=900;const hb=()=>{if(d<260)return;thump();d*=.9;later(hb,d)};hb();
  drum(T/1000);riser(T/1000);
  later(()=>{$('#stage').classList.remove('shake');cov.className='cov';whoosh();later(()=>reveal(rest,w,done),550)},T);
}
const EFF={slot,spot,roulette,count,curtain};

/* ---------- 진행 ---------- */
function cleanup(){
  timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);
  $('#field').hidden=true;$('#wheel').hidden=true;$('#name').hidden=false;
  $('#cov').className='cov';$('#stage').classList.remove('dim','shake');live(false);
  busy=false;skipFn=null;$('#go').disabled=false;$('#skip').hidden=true;
}
function say(a,b){if(ROLE==='control'){$('#cs').textContent=a;$('#cs2').textContent=b||''}else{setName(a,'many');$('#cap').textContent=b||''}}
function draw(){
  if(busy)return;
  const p=pool();
  if(!p.length){say('뽑을 사람이 없어요','빠진 사람을 되돌려 주세요');return}
  const k=Math.min(st.cnt,p.length),win=choose(p,k);
  let kind=st.anim;if(kind==='random')kind=['slot','spot','roulette','count','curtain'][rnd(5)];
  if(ROLE==='control'){
    busy=true;$('#go').disabled=true;$('#skipC').hidden=kind==='instant';
    $('#cs').textContent='뽑는 중…';$('#cs2').textContent='학생 화면에서 연출이 진행되고 있어요.';
    clearTimeout(wd);wd=setTimeout(()=>{busy=false;$('#go').disabled=false;$('#skipC').hidden=true},120000);
    api.pk({type:'run',kind,rest:p,win,st:{mode:st.mode,snd:st.snd,fake:st.fake,spd:st.spd}});
    return;
  }
  runLocal(p,win,kind);
}
function runLocal(p,win,kind){
  A();fakeUsed=false;
  $('#got').innerHTML='';$('#cap').textContent='';
  cancelAnimationFrame(cfRaf);{const fx=$('#fx');fx.getContext('2d').clearRect(0,0,fx.width,fx.height)}
  if(kind==='instant')return finish(win,false);
  busy=true;$('#go').disabled=true;$('#skip').hidden=false;skipFn=()=>finish(win,false);
  next(p,win,0,kind);
}
function next(p,win,i,kind){
  const rest=p.filter(x=>!win.slice(0,i).includes(x));
  EFF[kind](rest,win[i],()=>{
    if(i+1<win.length){$('#cap').textContent=`${i+1}명째 당첨! 다음은…`;later(()=>next(p,win,i+1,kind),1700)}
    else later(()=>finish(win,true),400);
  });
}
function finish(win,shown){
  cleanup();
  if(!shown||win.length>1){
    setName(win.map(lab).join(', '),'pop'+(win.length>1||big(win[0])?' many':''));$('#cap').textContent=win.length>1?`${win.length}명 당첨! 나와 주세요`:'나와 주세요!';
    if(!shown){fanfare();confetti();$('#got').innerHTML=''}
  }
  if(ROLE==='stage'){api.pk({type:'finished',win});return}
  record(win);
}
function record(win){
  hist.unshift({t:Date.now(),w:win.map(lab)});
  if(st.auto)st.ex=[...new Set([...st.ex,...win])];
  save();render();
}

function render(){
  document.querySelectorAll('#anim button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===st.anim));
  document.querySelectorAll('#spd button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===st.spd));
  document.querySelectorAll('#mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===st.mode));
  $('#numBox').hidden=st.mode!=='num';$('#nameBox').hidden=st.mode!=='name';
  $('#n').value=st.n;$('#cntv').textContent=st.cnt;$('#auto').checked=st.auto;$('#snd').checked=st.snd;$('#fake').checked=st.fake;
  const r=roster(),ex=new Set(st.ex);
  $('#chips').innerHTML=r.length?r.map(x=>`<button class="chip${ex.has(x)?' off':''}" data-x="${esc(x)}" aria-pressed="${!ex.has(x)}">${esc(x)}</button>`).join(''):'<p class="empty">이름을 입력하고 적용을 눌러 주세요.</p>';
  $('#left').textContent=`뽑을 수 있는 사람 ${pool().length}명 / 전체 ${r.length}명`;
  hist=hist.filter(h=>Date.now()-h.t<DAY);
  const fmt=t=>new Date(t).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  $('#hist').innerHTML=hist.length?hist.map(h=>`<li><time>${fmt(h.t)}</time><span>${h.w.map(esc).join(', ')}</span></li>`).join(''):'<li class="empty">아직 뽑은 기록이 없어요. 기록은 24시간 동안 남아요.</li>';
}

$('#go').onclick=draw;
$('#skip').onclick=()=>skipFn&&skipFn();
$('#anim').onclick=e=>{const v=e.target.dataset.v;if(v){st.anim=v;save();render()}};
$('#spd').onclick=e=>{const v=e.target.dataset.v;if(v){st.spd=v;save();render()}};
$('#mode').onclick=e=>{const v=e.target.dataset.v;if(v&&v!==st.mode){st.mode=v;st.ex=[];if(v==='name'&&!st.names.trim())st.names='김하늘\n이바다\n박구름\n최별\n정나무\n한들\n윤솔\n강비';$('#names').value=st.names;save();render()}};
$('#n').onchange=e=>{st.n=Math.max(1,Math.min(99,+e.target.value||1));st.ex=st.ex.filter(x=>+x<=st.n);save();render()};
$('#apply').onclick=()=>{st.names=$('#names').value;st.ex=[];save();render()};
$('#m').onclick=()=>{st.cnt=Math.max(1,st.cnt-1);save();render()};
$('#p').onclick=()=>{st.cnt=Math.min(10,st.cnt+1);save();render()};
$('#auto').onchange=e=>{st.auto=e.target.checked;save()};
$('#fake').onchange=e=>{st.fake=e.target.checked;save()};
$('#snd').onchange=e=>{st.snd=e.target.checked;save()};
$('#clrEx').onclick=()=>{st.ex=[];save();render()};
$('#clrH').onclick=()=>{hist=[];save();render()};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b||busy)return;const x=b.dataset.x;st.ex=st.ex.includes(x)?st.ex.filter(y=>y!==x):[...st.ex,x];save();render()};
const toggleFs=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
$('#fs').onclick=toggleFs;
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==='f'||e.key==='F'){toggleFs();return}
  const skipNow=()=>ROLE==='control'?api.pk({type:'skip'}):(skipFn&&skipFn());
  if(e.code==='Space'||e.key==='Enter'){if(e.target.tagName==='BUTTON'&&e.key==='Enter')return;e.preventDefault();busy?skipNow():draw()}
  if(e.key==='Escape'&&busy)skipNow();
});
$('#names').value=st.names;
if(ROLE==='stage'){
  setName('?');$('#cap').textContent='곧 뽑기를 시작해요';
  api.on('pk',m=>{
    if(m.type==='run'){
      Object.assign(st,m.st);fakeUsed=false;$('#got').innerHTML='';$('#cap').textContent='';
      cancelAnimationFrame(cfRaf);{const fx=$('#fx');fx.getContext('2d').clearRect(0,0,fx.width,fx.height)}
      if(busy)cleanup();
      if(m.kind==='instant')return finish(m.win,false);
      busy=true;skipFn=()=>finish(m.win,false);next(m.rest,m.win,0,m.kind);
    }else if(m.type==='skip'&&skipFn)skipFn();
  });
  api.pk({type:'ready'});
}else render();
if(ROLE==='control'){
  $('#skipC').onclick=()=>api.pk({type:'skip'});
  api.on('pk',m=>{if(m.type==='finished'){
    clearTimeout(wd);busy=false;$('#go').disabled=false;$('#skipC').hidden=true;record(m.win);
    $('#cs').textContent=m.win.map(lab).join(', ');$('#cs2').textContent='당첨! 나와 주세요';
  }});
}
}
</script>
</body>
